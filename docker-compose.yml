services:
  mongodb:
    image: mongo:7
    container_name: realtime-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: realtime-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-server:
    build:
      context: .
      dockerfile: api-server/Dockerfile
    container_name: realtime-api-server
    environment:
      MONGODB_URI: mongodb://mongodb:27017/realtime?uuidRepresentation=STANDARD&waitQueueTimeoutMS=5000
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy

  chat-server-1:
    build:
      context: .
      dockerfile: chat-server/Dockerfile
    container_name: realtime-chat-server-1
    environment:
      MONGODB_URI: mongodb://mongodb:27017/realtime?uuidRepresentation=STANDARD&waitQueueTimeoutMS=5000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8081
      CHAT_INSTANCE_ID: chat-server-1
      # 로컬 e2e용 빠른 self-healing 주기 (운영 default는 30s)
      REDIS_SELF_HEALING_INTERVAL_MS: "3000"
    ports:
      - "8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  chat-server-2:
    build:
      context: .
      dockerfile: chat-server/Dockerfile
    container_name: realtime-chat-server-2
    environment:
      MONGODB_URI: mongodb://mongodb:27017/realtime?uuidRepresentation=STANDARD&waitQueueTimeoutMS=5000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8082
      CHAT_INSTANCE_ID: chat-server-2
      REDIS_SELF_HEALING_INTERVAL_MS: "3000"
    ports:
      - "8082:8082"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mongodb-data:
