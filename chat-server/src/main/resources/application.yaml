spring:
  application:
    name: chat-server
  data:
    mongodb:
      # uuidRepresentation=STANDARD가 필수 — UUIDv7 _id를 BSON subtype 4(byte-by-byte 비교가
      # timestamp 순서가 됨)로 저장. 디폴트(JAVA_LEGACY, subtype 3)는 long의 byte order를 reverse해
      # _id 정렬이 random처럼 깨진다(설계서 §9.2 정렬 기준 위반).
      # waitQueueTimeoutMS=5000 — 커넥션 풀 고갈 시 5초 안에 못 얻으면 fail-fast(설계서 §15.2).
      uri: ${MONGODB_URI:mongodb://localhost:27017/realtime?uuidRepresentation=STANDARD&waitQueueTimeoutMS=5000}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Lettuce sync 호출 timeout — Redis 끊김 시 60초 hang을 막아 핫패스가 멈추지 않도록(§15.4).
      # 첫 publish가 2초만에 실패 → circuit breaker가 빠르게 OPEN 으로 전환.
      timeout: 2s
      connect-timeout: 2s

server:
  port: ${SERVER_PORT:8081}

chat:
  instance-id: ${CHAT_INSTANCE_ID:chat-server-local}

# Actuator (설계서 §15.1·§15.4) — 채팅 서버 헬스체크. Redis·Mongo 둘 다 indicator로 자동 등록.
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      service: chat-server
      instance: ${CHAT_INSTANCE_ID:chat-server-local}

presence:
  # 클라이언트 heartbeat 주기(10초)의 3배. heartbeat가 멈추면 TTL 만료로 자연히 OFFLINE 판정(설계서 §8.3).
  ttl-seconds: ${PRESENCE_TTL_SECONDS:30}

resume:
  # last_event_id 이후 이벤트 수가 이 값을 초과하면 증분 catch-up 대신 스냅샷 기반 초기 로드로 전환(설계서 §9.3).
  catchup-threshold: ${RESUME_CATCHUP_THRESHOLD:1000}
  # 증분 응답의 기본 limit. 클라이언트가 요청에 명시하지 않을 때 적용.
  default-limit: ${RESUME_DEFAULT_LIMIT:200}

# Resilience4j circuit breaker (설계서 §15.4 graceful degradation)
# - Redis publish/presence 실패가 연속되면 OPEN으로 전환해 fast-fail → 죽어가는 Redis에
#   매 요청 연결을 시도하며 지연이 쌓이는 것을 막는다.
# - sliding window의 실패 비율이 임계치를 넘으면 OPEN → wait-duration 후 HALF_OPEN → 성공 시 CLOSED.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 6
        minimum-number-of-calls: 3       # 첫 3번 빠르게 실패하면 OPEN으로 전환 — 핫패스 hang 최소화
        failure-rate-threshold: 50       # 최근 호출의 50% 이상 실패 시 OPEN
        wait-duration-in-open-state: 5s  # OPEN 상태 유지 시간
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
    instances:
      redis-publish: { base-config: default }
      redis-presence: { base-config: default }
