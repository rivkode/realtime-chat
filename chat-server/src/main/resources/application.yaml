spring:
  application:
    name: chat-server
  data:
    mongodb:
      # uuidRepresentation=STANDARD가 필수 — UUIDv7 _id를 BSON subtype 4(byte-by-byte 비교가
      # timestamp 순서가 됨)로 저장. 디폴트(JAVA_LEGACY, subtype 3)는 long의 byte order를 reverse해
      # _id 정렬이 random처럼 깨진다(설계서 §9.2 정렬 기준 위반).
      # waitQueueTimeoutMS=5000 — 커넥션 풀 고갈 시 5초 안에 못 얻으면 fail-fast(설계서 §15.2).
      uri: ${MONGODB_URI:mongodb://localhost:27017/realtime?uuidRepresentation=STANDARD&waitQueueTimeoutMS=5000}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8081}

chat:
  instance-id: ${CHAT_INSTANCE_ID:chat-server-local}

# Actuator (설계서 §15.1·§15.4) — 채팅 서버 헬스체크. Redis·Mongo 둘 다 indicator로 자동 등록.
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

presence:
  # 클라이언트 heartbeat 주기(10초)의 3배. heartbeat가 멈추면 TTL 만료로 자연히 OFFLINE 판정(설계서 §8.3).
  ttl-seconds: ${PRESENCE_TTL_SECONDS:30}

resume:
  # last_event_id 이후 이벤트 수가 이 값을 초과하면 증분 catch-up 대신 스냅샷 기반 초기 로드로 전환(설계서 §9.3).
  catchup-threshold: ${RESUME_CATCHUP_THRESHOLD:1000}
  # 증분 응답의 기본 limit. 클라이언트가 요청에 명시하지 않을 때 적용.
  default-limit: ${RESUME_DEFAULT_LIMIT:200}
