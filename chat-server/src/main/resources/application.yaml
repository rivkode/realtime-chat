spring:
  application:
    name: chat-server
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/realtime}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8081}

chat:
  instance-id: ${CHAT_INSTANCE_ID:chat-server-local}

presence:
  # 클라이언트 heartbeat 주기(10초)의 3배. heartbeat가 멈추면 TTL 만료로 자연히 OFFLINE 판정(설계서 §8.3).
  ttl-seconds: ${PRESENCE_TTL_SECONDS:30}

resume:
  # last_event_id 이후 이벤트 수가 이 값을 초과하면 증분 catch-up 대신 스냅샷 기반 초기 로드로 전환(설계서 §9.3).
  catchup-threshold: ${RESUME_CATCHUP_THRESHOLD:1000}
  # 증분 응답의 기본 limit. 클라이언트가 요청에 명시하지 않을 때 적용.
  default-limit: ${RESUME_DEFAULT_LIMIT:200}
